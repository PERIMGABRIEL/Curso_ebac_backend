<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://jakarta.ee/web/ui">
<h:head>
    <title>Cadastro de Livros</title>
</h:head>
<h:body>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Título:" />
            <h:inputText value="#{livroController.livro.titulo}" />

            <h:outputLabel value="Autor:" />
            <h:inputText value="#{livroController.livro.autor}" />

            <h:outputLabel value="Ano de Publicação:" />
            <h:inputText value="#{livroController.livro.anoPublicacao}" />

            <h:outputLabel value="Gênero:" />
            <h:inputText value="#{livroController.livro.genero}" />

            <h:commandButton value="Salvar" action="#{livroController.salvar}" />
        </h:panelGrid>
    </h:form>

    <h:dataTable value="#{livroController.livros}" var="livro">
        <h:column>
            <f:facet name="header">Título</f:facet>
            #{livro.titulo}
        </h:column>
        <h:column>
            <f:facet name="header">Autor</f:facet>
            #{livro.autor}
        </h:column>
        <h:column>
            <f:facet name="header">Ano</f:facet>
            #{livro.anoPublicacao}
        </h:column>
        <h:column>
            <f:facet name="header">Gênero</f:facet>
            #{livro.genero}
        </h:column>
        <h:column>
            <h:commandButton value="Excluir" action="#{livroController.remover(livro)}" />
        </h:column>
    </h:dataTable>
</h:body>
</html>
